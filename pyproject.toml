[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-dice-bot"
version = "1.0.0"
description = "A feature-rich Discord bot for RPG dice rolling with advanced notation support"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Gabintrus", email = "gabintrus@protonmail.com"}
]
maintainers = [
    {name = "Gabintrus", email = "gabintrus@protonmail.com"}
]
keywords = [
    "discord",
    "bot",
    "dice",
    "rpg",
    "tabletop",
    "roller"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Role-Playing",
    "Topic :: Communications :: Chat",
]
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.3.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/discord-dice-bot"
Repository = "https://github.com/yourusername/discord-dice-bot"
Issues = "https://github.com/yourusername/discord-dice-bot/issues"
Changelog = "https://github.com/yourusername/discord-dice-bot/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in default args (intentional for dataclasses)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
